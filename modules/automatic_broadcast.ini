; automatic_broadcast.ini  –  user overrides for 2kDer AutoBroadcast
; -----------------------------------------------------------------
;
; This file is completely optional. If it's missing or you leave
; a line commented out, the module just uses its built‑in defaults.
;
; Everything here directly mirrors the settings in the Lua script,
; so you never need to touch the code. Edit, save, and the next
; match will pick up your changes.

[AutoBroadcast]

; The fallback pack that gets used when there's no special occasion
; (Euroleague, Blacktop, Training, MyCareer, etc.).
default = nba_espn

; The list of broadcast packs for regular season & quick games.
; We randomly pick one of these before each match (or once per session,
; depending on random_mode below).
; Separate names with commas – spaces are optional.
regular_packs = tnt, espn, nbatv, tnt_gold

; How randomisation works:
;   random_each_game     → new random pick every time you start a match
;   random_per_session   → picks once when the game launches and sticks
;                          until you close NBA 2K14
; The per‑session option is great if you want a consistent “channel”
; for a whole play session.
random_mode = random_each_game

; Playoff round overrides (only matter in game_mode 3 – Playoffs).
; playoff_round values:
;   1 = First Round
;   2 = Conference Semifinals
;   3 = Conference Finals
;   4 = NBA Finals
; For the Finals we have two options:
;   finals        → used for Games 2‑7
;   finals_game1  → used only for Game 1 (you can give it a special
;                    opening‑night package)
playoffs_rd1  = tnt
playoffs_conf = tnt_conf
finals        = espn_finals
finals_game1  = espn_finals_g1

; All‑Star Game (game_mode 7) uses this pack.
all_star = tnt_allstar

; Special in‑game calendar dates. Format: MM-DD = pack_name
; When the game's internal calendar matches one of these dates,
; we use the corresponding pack – no matter what mode you're in.
; Add as many as you like; we only ship a few examples.
; Christmas, Valentine's, Halloween, Thanksgiving...
special_dates = 12-25:christmas, 02-14:valentine, 10-31:halloween, 11-23:thanksgiving
