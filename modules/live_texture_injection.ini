; live_texture_injection.ini  –  user overrides for LiveTexture
; ----------------------------------------------------------------
;
; Tweak the texture injection behaviour without touching the Lua.
; Everything is optional – anything you leave out falls back to
; the module's sensible defaults.

[LiveTexture]

; Hotkey to dump the currently loaded .iff archives into liveff_dump/
; (uses the same key names as Sider, once 2kDer's input API is ready)
dump_key = F7

; Set this to true if you want 2kDer to watch the liveff_textures/
; folder for changes and automatically rebuild the patched .iff
; when you save a texture from Photoshop or GIMP.
auto_reload = false
